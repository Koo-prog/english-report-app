<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>영어 문법 교정 리포트 생성기</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 40px 16px;
    }

    .container {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.1);
      padding: 40px;
      width: 100%;
      max-width: 680px;
    }

    h1 { text-align: center; color: #1a56db; font-size: 1.8rem; margin-bottom: 8px; }

    .subtitle { text-align: center; color: #6b7280; font-size: 0.95rem; margin-bottom: 32px; }

    .form-group { margin-bottom: 20px; }

    label { display: block; font-weight: 600; color: #374151; margin-bottom: 6px; font-size: 0.95rem; }

    input[type="text"], input[type="password"], textarea {
      width: 100%; padding: 10px 14px;
      border: 1px solid #d1d5db; border-radius: 8px;
      font-size: 0.95rem; color: #111827;
      transition: border-color 0.2s; font-family: inherit;
    }

    input[type="text"]:focus, input[type="password"]:focus, textarea:focus {
      outline: none; border-color: #1a56db;
      box-shadow: 0 0 0 3px rgba(26,86,219,0.12);
    }

    textarea { resize: vertical; min-height: 160px; }

    .btn {
      display: block; width: 100%; padding: 12px; border: none;
      border-radius: 8px; font-size: 1rem; font-weight: 600;
      cursor: pointer; transition: background 0.2s, opacity 0.2s;
    }

    .btn-primary { background: #1a56db; color: #fff; }
    .btn-primary:hover:not(:disabled) { background: #1648c0; }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-download { background: #059669; color: #fff; margin-top: 12px; }
    .btn-download:hover { background: #047857; }

    .loading { display: none; text-align: center; margin-top: 16px; color: #1a56db; font-size: 0.95rem; }
    .loading.visible { display: block; }

    .spinner {
      display: inline-block; width: 20px; height: 20px;
      border: 3px solid #d1d5db; border-top-color: #1a56db;
      border-radius: 50%; animation: spin 0.8s linear infinite;
      vertical-align: middle; margin-right: 8px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .error-msg {
      display: none; background: #fef2f2; border: 1px solid #fca5a5;
      color: #b91c1c; border-radius: 8px; padding: 12px 16px;
      margin-top: 16px; font-size: 0.9rem;
    }
    .error-msg.visible { display: block; }

    .result-area { display: none; margin-top: 24px; }
    .result-area.visible { display: block; }

    .divider { border: none; border-top: 1px solid #e5e7eb; margin: 28px 0; }

    .preview-card {
      border: 1px solid #e5e7eb; border-radius: 10px;
      padding: 28px; background: #fafafa;
    }

    .preview-title {
      text-align: center; font-size: 1.4rem; font-weight: 700;
      color: #1a56db; margin-bottom: 4px;
    }

    .preview-student { text-align: center; color: #6b7280; font-size: 0.9rem; margin-bottom: 20px; }

    .section-block { border-left: 4px solid #1a56db; padding-left: 14px; margin-bottom: 20px; }
    .section-block h3 { font-size: 1rem; color: #1a56db; margin-bottom: 8px; }
    .section-block p { font-size: 0.9rem; color: #374151; line-height: 1.6; }

    .corrections-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; margin-top: 6px; }
    .corrections-table th {
      background: #1a56db; color: #fff;
      padding: 8px 10px; text-align: left; font-weight: 600;
    }
    .corrections-table td {
      padding: 7px 10px; border-bottom: 1px solid #e5e7eb;
      color: #374151; vertical-align: top;
    }
    .corrections-table tr:nth-child(even) td { background: #f3f4f6; }

    .focus-type { color: #6b7280; font-size: 0.82rem; }

    .api-key-hint { font-size: 0.82rem; color: #6b7280; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📝 영어 문법 교정 리포트</h1>
    <p class="subtitle">영어 스크립트를 입력하면 문법을 분석하고 PDF 리포트를 생성해드립니다.</p>

    <div class="form-group">
      <label for="studentName">학생 이름</label>
      <input type="text" id="studentName" placeholder="예: 홍길동" />
    </div>

    <div class="form-group">
      <label for="scriptInput">영어 스크립트 (음성 전사본)</label>
      <textarea id="scriptInput" placeholder="여기에 영어 음성을 텍스트로 옮긴 내용을 입력하세요."></textarea>
    </div>

    <div class="form-group">
      <label for="apiKey">Groq API 키</label>
      <input type="password" id="apiKey" placeholder="여기에 Groq API 키 입력 (console.groq.com에서 발급)" />
      <p class="api-key-hint">API 키는 Groq API 호출 시 헤더로만 사용되며 별도 서버로 전송되지 않습니다. (무료)</p>
    </div>

    <button class="btn btn-primary" id="generateBtn" onclick="generateReport()">🚀 리포트 생성</button>

    <div class="loading" id="loading">
      <span class="spinner"></span> Groq AI가 문법을 분석 중입니다…
    </div>

    <div class="error-msg" id="errorMsg"></div>

    <div class="result-area" id="resultArea">
      <hr class="divider" />
      <div class="preview-card" id="previewCard"></div>
      <button class="btn btn-download" onclick="downloadPDF()">📄 PDF 다운로드</button>
    </div>
  </div>

  <script>
    let lastResult = null;
    let lastStudentName = '';

    function buildPrompt(studentName, script) {
      return `You are making a 1-page Book Review Report for an ESL student named "${studentName}".

Return ONLY a valid JSON object — no markdown, no extra text, no code fences.

Use this exact JSON structure:
{
  "strengths": "A positive paragraph about what the student did well.",
  "corrections": [
    {
      "original": "The exact short phrase from the transcript (1 sentence max).",
      "fix": "old word → new word",
      "focusType": "Grammar Category",
      "corrected": "The full corrected sentence with **changed_word** in double asterisks."
    }
  ],
  "comments": "A short encouraging paragraph mentioning grammar areas to practice."
}

FIELD RULES:
- "fix": always use arrow format: "old → new"  (e.g. "go → went", "in → at", "want → wanted")
- "focusType": one of: Past Tense / Article / Preposition / Verb Form / Subject-Verb Agreement / Plural Noun / Irregular Verb / Sentence Structure / Pronoun
- "corrected": wrap ONLY the changed word(s) in **double asterisks** so they appear bold. Example: "The story took place **at** Amusement Park."

================================
CORE RULE — SPOKEN TRANSCRIPT

This is a spoken English transcript. Only correct CLEAR grammar errors the student actually said.
DO NOT correct transcription errors, mishearings, or unclear pronunciation.

DO CORRECT:
- Past Tense, Articles, Prepositions, Verb Form, Subject-Verb Agreement, Plural Nouns, Irregular Verbs, Basic Sentence Structure, Pronouns (only when clearly wrong)

DO NOT CORRECT:
- Spelling differences that may be pronunciation/transcription errors
- Commas or list punctuation (cannot be heard in speech)
- Book titles or character names (may be misheard)
- Filler words or repetitions (e.g. "and and and", "um", "like")
- Unclear or ambiguous meaning — do not guess
- Style or tone changes — only fix clear grammar

NUMBER OF CORRECTIONS: select about 5 — only high-confidence, clear errors. Fewer is better than weak ones.

IMPORTANT MATCH RULE:
The word in "fix" (after →) must EXACTLY match the **bold** word in "corrected".
Example:
  fix: "go → went"
  corrected: "They **went** to the beach."  ✅

================================
Student: ${studentName}
Transcript:
${script}`;
    }

    async function generateReport() {
      const studentName = document.getElementById('studentName').value.trim();
      const script    = document.getElementById('scriptInput').value.trim();
      const apiKey    = document.getElementById('apiKey').value.trim();

      if (!apiKey)       { showError('Groq API 키를 입력해주세요.'); return; }
      if (!script)       { showError('영어 스크립트를 입력해주세요.'); return; }
      if (!studentName)  { showError('학생 이름을 입력해주세요.'); return; }

      hideError();
      setLoading(true);
      document.getElementById('resultArea').classList.remove('visible');

      try {
        const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${apiKey}`
          },
          body: JSON.stringify({
            model: 'llama-3.3-70b-versatile',
            messages: [
              {
                role: 'system',
                content: 'You are an experienced ESL teacher. You write concise, encouraging Book Review Reports for young ESL students. You only return valid JSON with no markdown formatting.'
              },
              { role: 'user', content: buildPrompt(studentName, script) }
            ],
            temperature: 0.3
          })
        });

        if (!response.ok) {
          const errData = await response.json().catch(() => ({}));
          throw new Error(`API 오류: ${errData?.error?.message || 'HTTP ' + response.status}`);
        }

        const data    = await response.json();
        const rawText = data?.choices?.[0]?.message?.content || '';

        const fenceMatch = rawText.match(/```(?:json)?\s*([\s\S]*?)```/i);
        const jsonText   = (fenceMatch ? fenceMatch[1] : rawText).trim();
        const result     = JSON.parse(jsonText);

        lastResult      = result;
        lastStudentName = studentName;

        renderPreview(result, studentName);
        document.getElementById('resultArea').classList.add('visible');
      } catch (err) {
        showError(err.message || '알 수 없는 오류가 발생했습니다.');
      } finally {
        setLoading(false);
      }
    }

    /* ── Helpers ── */

    // Returns HTML for Focus/Fix cell: "in → at<br><span>(Preposition)</span>"
    function focusFixHtml(c) {
      const fix  = escapeHtml(c.fix || '');
      const type = escapeHtml(c.focusType || '');
      if (fix && type) return `${fix}<br><span class="focus-type">(${type})</span>`;
      return fix || type;
    }

    // Returns HTML for After Correction cell: bold the **word**
    function correctedHtml(text) {
      return escapeHtml(text || '').replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
    }

    // Plain text for PDF (strip ** markers)
    function correctedPlain(text) {
      return (text || '').replace(/\*\*(.*?)\*\*/g, '$1');
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    /* ── Render HTML preview ── */
    function renderPreview(result, studentName) {
      const corrections = Array.isArray(result.corrections) ? result.corrections : [];

      const tableRows = corrections.map(c => `
        <tr>
          <td>${escapeHtml(c.original || '')}</td>
          <td>${focusFixHtml(c)}</td>
          <td>${correctedHtml(c.corrected || '')}</td>
        </tr>`).join('');

      document.getElementById('previewCard').innerHTML = `
        <div class="preview-title">Book Review Report</div>
        <div class="preview-student">Student: ${escapeHtml(studentName)}</div>

        <div class="section-block">
          <h3>1. Strengths</h3>
          <p>${escapeHtml(result.strengths || '')}</p>
        </div>

        <div class="section-block">
          <h3>2. Sentence Corrections</h3>
          ${corrections.length > 0 ? `
          <table class="corrections-table">
            <thead><tr>
              <th>Original</th><th>Focus / Fix</th><th>After Correction</th>
            </tr></thead>
            <tbody>${tableRows}</tbody>
          </table>` : '<p>문법 오류가 발견되지 않았습니다.</p>'}
        </div>

        <div class="section-block">
          <h3>3. Teacher\'s Comments</h3>
          <p>${escapeHtml(result.comments || '')}</p>
        </div>`;
    }

    /* ── PDF download ── */
    function downloadPDF() {
      if (!lastResult) return;

      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });

      const pageW    = doc.internal.pageSize.getWidth();
      const pageH    = doc.internal.pageSize.getHeight();
      const margin   = 20;
      const contentW = pageW - margin * 2;
      let y = 20;

      function checkPageBreak(needed) {
        if (y + needed > pageH - margin) { doc.addPage(); y = margin; }
      }

      // Title
      doc.setFontSize(20); doc.setTextColor(26,86,219); doc.setFont('helvetica','bold');
      doc.text('Book Review Report', pageW/2, y, { align: 'center' });
      y += 8;

      // Student
      doc.setFontSize(11); doc.setTextColor(107,114,128); doc.setFont('helvetica','normal');
      doc.text(`Student: ${lastStudentName}`, pageW/2, y, { align: 'center' });
      y += 10;

      // Rule
      doc.setDrawColor(229,231,235); doc.setLineWidth(0.5);
      doc.line(margin, y, pageW-margin, y); y += 8;

      function drawSection(num, title, body) {
        checkPageBreak(20);
        doc.setFillColor(26,86,219); doc.rect(margin, y, 1.5, 6, 'F');
        doc.setFontSize(12); doc.setTextColor(26,86,219); doc.setFont('helvetica','bold');
        doc.text(`${num}. ${title}`, margin+4, y+5); y += 10;
        doc.setFontSize(10); doc.setTextColor(55,65,81); doc.setFont('helvetica','normal');
        doc.splitTextToSize(body, contentW-4).forEach(line => {
          checkPageBreak(6); doc.text(line, margin+4, y); y += 5.5;
        });
        y += 4;
      }

      drawSection(1, 'Strengths', lastResult.strengths || '');

      // Section 2 header
      checkPageBreak(20);
      doc.setFillColor(26,86,219); doc.rect(margin, y, 1.5, 6, 'F');
      doc.setFontSize(12); doc.setTextColor(26,86,219); doc.setFont('helvetica','bold');
      doc.text('2. Sentence Corrections', margin+4, y+5); y += 10;

      const corrections = Array.isArray(lastResult.corrections) ? lastResult.corrections : [];

      if (corrections.length === 0) {
        doc.setFontSize(10); doc.setTextColor(55,65,81); doc.setFont('helvetica','normal');
        doc.text('No grammar errors found.', margin+4, y); y += 8;
      } else {
        const colW  = [contentW*0.33, contentW*0.27, contentW*0.40];
        const colX  = [margin, margin+colW[0], margin+colW[0]+colW[1]];
        const hdrH  = 8;

        checkPageBreak(hdrH+4);
        doc.setFillColor(26,86,219); doc.rect(margin, y, contentW, hdrH, 'F');
        doc.setFontSize(9); doc.setTextColor(255,255,255); doc.setFont('helvetica','bold');
        ['Original','Focus / Fix','After Correction'].forEach((h,i) => {
          doc.text(h, colX[i]+2, y+5.5);
        });
        y += hdrH;

        corrections.forEach((row, idx) => {
          // Focus/Fix: "in → at\n(Preposition)"
          const fixLine  = row.fix || '';
          const typeLine = row.focusType ? `(${row.focusType})` : '';
          const focusCombined = fixLine + (typeLine ? '\n' + typeLine : '');

          const cell0 = doc.splitTextToSize(row.original || '', colW[0]-4);
          const cell1 = doc.splitTextToSize(focusCombined, colW[1]-4);
          const cell2 = doc.splitTextToSize(correctedPlain(row.corrected), colW[2]-4);

          const maxLines = Math.max(cell0.length, cell1.length, cell2.length);
          const rowH = Math.max(maxLines * 5 + 4, 9);

          checkPageBreak(rowH);

          if (idx % 2 === 1) {
            doc.setFillColor(243,244,246);
            doc.rect(margin, y, contentW, rowH, 'F');
          }

          doc.setFontSize(9); doc.setTextColor(55,65,81); doc.setFont('helvetica','normal');

          // Col 0: original
          cell0.forEach((line, li) => doc.text(line, colX[0]+2, y+5+li*5));

          // Col 1: fix line normal, type line gray
          cell1.forEach((line, li) => {
            const isTypeLine = line.startsWith('(');
            if (isTypeLine) { doc.setTextColor(120,120,120); }
            else            { doc.setTextColor(55,65,81); }
            doc.text(line, colX[1]+2, y+5+li*5);
          });
          doc.setTextColor(55,65,81);

          // Col 2: corrected (bold the changed word inline)
          const rawCorrected = row.corrected || '';
          const segments = rawCorrected.split(/(\*\*.*?\*\*)/g);
          let cx = colX[2] + 2;
          let lineY = y + 5;
          // For simplicity, render on one logical line with font switching
          // We'll just draw the full plain text but bold the marked word
          // using a simple approach: split, measure, draw
          const lineHeight = 5;
          let currentLineX = colX[2] + 2;
          const maxColW = colW[2] - 4;

          // Flatten to words with bold flag
          const words = [];
          segments.forEach(seg => {
            const isBold = seg.startsWith('**') && seg.endsWith('**');
            const text = isBold ? seg.slice(2, -2) : seg;
            text.split(/(\s+)/).forEach(tok => {
              if (tok) words.push({ text: tok, bold: isBold && tok.trim().length > 0 });
            });
          });

          // Render word-wrapped with inline bold
          let lineBuffer = [];
          let lineWidth  = 0;
          const spaceW   = doc.getTextWidth(' ');
          const lineY0   = y + 5;
          let   linesDrawn = 0;

          function flushLine() {
            let px = colX[2] + 2;
            lineBuffer.forEach(w => {
              doc.setFont('helvetica', w.bold ? 'bold' : 'normal');
              doc.text(w.text, px, lineY0 + linesDrawn * lineHeight);
              px += doc.getTextWidth(w.text);
            });
            lineBuffer = []; lineWidth = 0; linesDrawn++;
          }

          words.forEach(w => {
            const ww = doc.getTextWidth(w.text);
            if (lineWidth + ww > maxColW && lineBuffer.length > 0) flushLine();
            lineBuffer.push(w);
            lineWidth += ww;
          });
          if (lineBuffer.length > 0) flushLine();
          doc.setFont('helvetica', 'normal');

          // Row border
          doc.setDrawColor(229,231,235); doc.setLineWidth(0.3);
          doc.line(margin, y+rowH, margin+contentW, y+rowH);

          y += rowH;
        });
        y += 6;
      }

      drawSection(3, "Teacher's Comments", lastResult.comments || '');

      const safeName = lastStudentName.replace(/[^a-zA-Z0-9가-힣]/g, '_') || 'student';
      doc.save(`report_${safeName}.pdf`);
    }

    function setLoading(on) {
      document.getElementById('loading').classList.toggle('visible', on);
      document.getElementById('generateBtn').disabled = on;
    }
    function showError(msg) {
      const el = document.getElementById('errorMsg');
      el.textContent = msg; el.classList.add('visible');
    }
    function hideError() {
      document.getElementById('errorMsg').classList.remove('visible');
    }
  </script>
</body>
</html>
